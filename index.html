function escapeHtml(value) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value ?? "").replace(/[&<>"']/g, (ch) => map[ch]);
}
function formatCurrency(n) { return `₹${(Number(n) || 0).toLocaleString("en-IN")}`; }
function toJsDate(v) { if (!v) return null; return typeof v.toDate === "function" ? v.toDate() : new Date(v); }
function formatDateTime(v) { const d = toJsDate(v); return d ? d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—"; }

function withTimeout(promise, ms = 6000) {

}

function validateTeamName(v) {

}
function validateMobile(v) {

}
function validatePlayerName(v, label) {

  if (t.length < 3) return `${label} must be at least 3 characters.`;

  return null;
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
  return dp[m][n];
}
function fuzzyScore(q, t) { q = q.toLowerCase(); t = t.toLowerCase(); return t.includes(q) ? 0 : levenshtein(q, t); }

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  return { path: path || "home", params };
}
function navigate(pathWithQuery) { window.location.hash = `#/${pathWithQuery}`; }
function buildHash(path, params = {}) {
  const clean = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== ""));
  const qs = new URLSearchParams(clean).toString();
  return qs ? `${path}?${qs}` : path;
}

function bindTournamentRegistrationView() {
  const form = document.getElementById("tRegForm");
  const errorBox = document.getElementById("tRegError");
  let submitting = false;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (submitting) return;
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const err = validateTeamName(data.teamName) || validateMobile(data.mobileNumber)
      || validatePlayerName(data.player1, "Player 1") || validatePlayerName(data.player2, "Player 2")
      || validatePlayerName(data.player3, "Player 3") || validatePlayerName(data.player4, "Player 4")
      || (data.substitute && data.substitute.trim() ? validatePlayerName(data.substitute, "Substitute name") : null);
    if (err) { errorBox.textContent = err; errorBox.classList.remove("hidden"); return; }
    errorBox.classList.add("hidden");
    submitting = true;

    guardBooking(buildHash("payment", { category: "tournament", categoryLabel: data.tournamentName, fee: data.fee, tournamentId: data.tournamentId }), () => {
      sessionStorage.setItem("arctic_tournament_reg", JSON.stringify(data));
    });
  });
}

function bindLoginView() {
  let mode = "login";
  const tabLogin = document.getElementById("tabLogin"), tabCreate = document.getElementById("tabCreate");
  const submitLabel = document.getElementById("loginSubmitLabel");
  const termsRow = document.getElementById("termsRow"), loginExtras = document.getElementById("loginExtras");
  const alertBox = document.getElementById("loginAlert");

  function setMode(next) {
    mode = next;
    const isCreate = mode === "create";
    tabLogin.classList.toggle("text-white", !isCreate); tabLogin.classList.toggle("border-b-2", !isCreate); tabLogin.classList.toggle("border-cyan", !isCreate);
    tabCreate.classList.toggle("text-white", isCreate); tabCreate.classList.toggle("border-b-2", isCreate); tabCreate.classList.toggle("border-cyan", isCreate);
    submitLabel.textContent = isCreate ? "Create Account" : "Login";
    termsRow.classList.toggle("hidden", !isCreate); termsRow.classList.toggle("flex", isCreate);
    loginExtras.classList.toggle("hidden", isCreate);
    alertBox.classList.add("hidden");
  }
  tabLogin.addEventListener("click", () => setMode("login"));
  tabCreate.addEventListener("click", () => setMode("create"));

  function showAlert(msg, kind = "error") {
    alertBox.textContent = msg;
    alertBox.className = "mb-4 text-sm rounded-lg px-4 py-3 " + (kind === "error" ? "bg-red-500/10 text-red-300 border border-red-500/30" : "bg-emerald-500/10 text-emerald-300 border border-emerald-500/30");
    alertBox.classList.remove("hidden");
  }
  function friendlyAuthError(err) {
    const map = {
      "auth/invalid-email": "That email address looks invalid.",
      "auth/user-not-found": "No account found with that email.",
      "auth/wrong-password": "Incorrect password.",
      "auth/email-already-in-use": "An account already exists with that email.",
      "auth/weak-password": "Password should be at least 6 characters.",
      "auth/popup-closed-by-user": "Google sign-in was closed before completing.",
    };
    return map[err.code] || "Something went wrong. Please try again.";
  }
  async function upsertUserProfile(user, provider) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { uid: user.uid, name: user.displayName || "", email: user.email || "", photoURL: user.photoURL || "", phone: user.phoneNumber || "", provider, createdAt: serverTimestamp(), lastLogin: serverTimestamp() });
    } else {
      await setDoc(ref, { lastLogin: serverTimestamp() }, { merge: true });

  }

  document.getElementById("googleBtn").addEventListener("click", async () => {
    try {
      const result = await signInWithPopup(auth, new GoogleAuthProvider());
      await upsertUserProfile(result.user, "google");
      consumeReturnTo();
    } catch (err) { showAlert(friendlyAuthError(err)); }
  });

  document.getElementById("forgotBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    if (!email) return showAlert('Enter your email above first, then tap "Forgot password?"');
    try { await sendPasswordResetEmail(auth, email); showAlert("Password reset email sent.", "success"); }
    catch (err) { showAlert(friendlyAuthError(err)); }
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const submitBtn = document.getElementById("loginSubmit");
    submitBtn.disabled = true; submitLabel.innerHTML = '<span class="spinner"></span>';
    try {
      if (mode === "create") {
        if (!document.getElementById("termsCheck").checked) throw { code: "terms" };
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(result.user);
        await upsertUserProfile(result.user, "password");
        showAlert("Account created — verification email sent. You can continue now.", "success");
      } else {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await upsertUserProfile(result.user, "password");
      }
      consumeReturnTo();
    } catch (err) {
      submitBtn.disabled = false; submitLabel.textContent = mode === "create" ? "Create Account" : "Login";
      showAlert(err.code === "terms" ? "Please accept the Terms to continue." : friendlyAuthError(err));
    }

}

   started and take real payments, but it doesn't protect against a
   deliberately tampered request. When you're ready to harden it, deploy
   the Cloud Function described in the BACKEND REFERENCE comment at the
   bottom of this file (creates a real Razorpay Order server-side and
   verifies the payment signature) — set CONFIG.backendBaseUrl and this
   same code automatically switches to that safer path.
========================================================================== */

// Loads Razorpay's checkout bundle on demand (only when someone actually
// opens the payment page) and caches it so it's only fetched once.
let razorpayScriptPromise = null;
function loadRazorpayScript() {
  if (window.Razorpay) return Promise.resolve();
  if (razorpayScriptPromise) return razorpayScriptPromise;
  razorpayScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://checkout.razorpay.com/v1/checkout.js";
    script.onload = () => resolve();
    script.onerror = () => { razorpayScriptPromise = null; reject(new Error("Could not load the payment gateway. Check your connection and try again.")); };
    document.head.appendChild(script);
  });
  return razorpayScriptPromise;
}

// GATEWAY INTEGRATION POINT #1 — figure out what to charge. If a backend
// is configured it looks the real price up server-side (never trusts the
// page); otherwise it uses the fee already shown in the booking flow so
// payments work immediately with no backend at all.
async function createOrderRequest({ category, slot, tournamentId, uid, fee }) {
  if (CONFIG.backendBaseUrl && CONFIG.backendBaseUrl !== "YOUR_BACKEND_BASE_URL") {
    const res = await fetch(`${CONFIG.backendBaseUrl}/createOrder`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category, slot, tournamentId, uid }),
    });
    if (!res.ok) throw new Error("Could not start payment. Please try again.");
    return res.json(); // { amount, orderId? }
  }
  return { amount: Number(fee) || 0 };
}

// GATEWAY INTEGRATION POINT #2 — opens the real Razorpay Checkout popup
// and resolves with Razorpay's response once the person actually pays.
async function openGatewayCheckout(order, meta) {
  await loadRazorpayScript();
  return new Promise((resolve, reject) => {
    const options = {
      key: CONFIG.razorpayKeyId,
      amount: Math.round(Number(order.amount) * 100), // paise
      currency: "INR",
      name: CONFIG.companyName,
      description: meta.slotLabel ? `${meta.categoryLabel} — ${meta.slotLabel}` : meta.categoryLabel,
      prefill: { name: currentUser?.displayName || "", email: currentUser?.email || "" },
      theme: { color: "#2563EB" },
      handler: (response) => resolve(response),
      modal: { ondismiss: () => reject(new Error("Payment was cancelled.")) },
    };
    if (order.orderId) options.order_id = order.orderId;
    const rzp = new window.Razorpay(options);
    rzp.on("payment.failed", (response) => reject(new Error(response.error?.description || "Payment failed. Please try again.")));
    rzp.open();
  });
}

// GATEWAY INTEGRATION POINT #3 — confirms the payment. With a backend
// configured it verifies Razorpay's signature server-side (the only fully
// tamper-proof path). Without one, it accepts Razorpay's own success
// callback — real money moves either way, this only affects how strictly
// the result is double-checked.
async function verifyPaymentRequest(gatewayResponse, bookingContext) {
  if (CONFIG.backendBaseUrl && CONFIG.backendBaseUrl !== "YOUR_BACKEND_BASE_URL") {
    const res = await fetch(`${CONFIG.backendBaseUrl}/verifyPayment`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...gatewayResponse, ...bookingContext }),
    });
    if (!res.ok) throw new Error("Payment could not be verified.");
    return res.json(); // { verified: true, paymentId }
  }
  if (!gatewayResponse?.razorpay_payment_id) throw new Error("Payment could not be confirmed.");
  return { verified: true, paymentId: gatewayResponse.razorpay_payment_id };
}

let paymentTimerInterval = null;
function bindPaymentView() {
  if (!currentUser) { rememberReturnTo(); window.location.hash = "#/login"; return; }

  const category = document.getElementById("pv_category").value;
  const categoryLabel = document.getElementById("pv_categoryLabel").value;
  const slot = document.getElementById("pv_slot").value;
  const slotLabel = document.getElementById("pv_slotLabel").value;
  const fee = document.getElementById("pv_fee").value;
  const tournamentId = document.getElementById("pv_tournamentId").value;

  let secondsLeft = 5 * 60;
  function draw() {
    const m = String(Math.max(0, Math.floor(secondsLeft / 60))).padStart(2, "0");
    const s = String(Math.max(0, secondsLeft % 60)).padStart(2, "0");
    document.getElementById("timer").textContent = `${m}:${s}`;
  }
  draw();
  paymentTimerInterval = setInterval(() => {
    secondsLeft--; draw();
    if (secondsLeft <= 0) {
      clearInterval(paymentTimerInterval);
      document.getElementById("qrBlock").classList.add("hidden");
      document.getElementById("expiredBlock").classList.remove("hidden");
    }
  }, 1000);

  document.getElementById("returnBtn")?.addEventListener("click", () => {
    const back = { "daily-grind": "daily-grind", "weekly-war": "weekly-war", "weekend-war": "weekend-war" }[category] || "tournaments";
    window.location.hash = `#/${back}`;
  });

  const payBtn = document.getElementById("payBtn");
  const payBtnLabel = document.getElementById("payBtnLabel");
  const payError = document.getElementById("payError");
  let paying = false;

  payBtn.addEventListener("click", async () => {
    if (paying || secondsLeft <= 0) return;
    paying = true; payError.classList.add("hidden");
    payBtn.disabled = true; payBtnLabel.innerHTML = '<span class="spinner"></span>';
    try {
      const order = await createOrderRequest({ category, slot, tournamentId, uid: currentUser.uid, fee });
      const gatewayResponse = await openGatewayCheckout(order, { categoryLabel, slotLabel });
      const verified = await verifyPaymentRequest(gatewayResponse, { category, slot, tournamentId, uid: currentUser.uid });
      if (!verified.verified) throw new Error("Payment could not be verified. No registration was created.");

      clearInterval(paymentTimerInterval);
      document.getElementById("sumStatus").textContent = "Paid";
      document.getElementById("sumStatus").className = "font-medium text-emerald-400";
      window.location.hash = `#/${buildHash("register", { category, categoryLabel, slot, slotLabel, fee, tournamentId, paymentId: verified.paymentId })}`;
    } catch (err) {
      payError.textContent = err.message || "Something went wrong. Please try again.";
      payError.classList.remove("hidden");
      payBtn.disabled = false; payBtnLabel.textContent = "Pay Now";
      paying = false;
    }
  });
}

function staticGroupLink(category, ctx = {}) {
  if (category === "daily-grind" && ctx.slot) {
    const slot = DEFAULT_SLOTS.find((s) => s.id === ctx.slot);
    return slot?.whatsappGroup || CONFIG.whatsappFallback.default;
  }
  if (category === "tournament" && ctx.tournamentId) {
    const t = DEFAULT_TOURNAMENTS.find((t) => t.id === ctx.tournamentId);
    return t?.whatsappGroup || CONFIG.whatsappFallback.default;
  }
  const docKey = { "weekly-war": "weekly_war", "weekend-war": "weekend_war" }[category];
  return (docKey && CONFIG.whatsappFallback[docKey]) || CONFIG.whatsappFallback.default;
}
async function fetchGroupLink(category, ctx = {}) {
  try {
    if (category === "daily-grind" && ctx.slot) {
      const snap = await withTimeout(getDoc(doc(db, "scrims", ctx.slot)));
      if (snap.exists() && snap.data().whatsappGroup) return snap.data().whatsappGroup;
    } else if (category === "tournament" && ctx.tournamentId) {
      const snap = await withTimeout(getDoc(doc(db, "tournaments", ctx.tournamentId)));
      if (snap.exists() && snap.data().whatsappGroup) return snap.data().whatsappGroup;
    } else {
      const docKey = { "weekly-war": "weekly_war", "weekend-war": "weekend_war" }[category];
      if (docKey) {
        const snap = await withTimeout(getDoc(doc(db, "whatsapp_links", docKey)));
        if (snap.exists() && snap.data().groupLink) return snap.data().groupLink;
      }
    }
  } catch { /* fall through to the static default below */ }
  return staticGroupLink(category, ctx);
}
function bindRegisterView() {
  const form = document.getElementById("regForm");
  if (!form) return;
  const errorBox = document.getElementById("regError");
  const submitBtn = document.getElementById("regSubmit"), submitLabel = document.getElementById("regSubmitLabel");
  let submitting = false;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (submitting) return;
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const err = validateTeamName(data.teamName) || validateMobile(data.mobileNumber);
    if (err) { errorBox.textContent = err; errorBox.classList.remove("hidden"); return; }
    errorBox.classList.add("hidden"); submitting = true;
    submitBtn.disabled = true; submitLabel.innerHTML = '<span class="spinner"></span>';

      const groupLink = await fetchGroupLink(data.category, { slot: data.slot, tournamentId: data.tournamentId });
      const existing = await getDoc(doc(db, "registrations", registrationId));
      if (existing.exists()) throw new Error("duplicate");

      await setDoc(doc(db, "registrations", registrationId), {
        registrationId, uid: currentUser.uid, category: data.category, categoryLabel: data.categoryLabel,
        slot: data.slot, slotLabel: data.slotLabel, entryFee: Number(data.fee), paymentStatus: "Paid",

        slot: data.slot, slotLabel: data.slotLabel, amount: Number(data.fee), paymentStatus: "Paid",

      window.location.hash = `#/${buildHash("success", { category: data.categoryLabel, groupLink, receiptNumber })}`;

      submitting = false; submitBtn.disabled = false; submitLabel.textContent = "Complete Registration";

let ordersUnsub = null;
function bindOrdersView() {
  if (!currentUser) { rememberReturnTo(); window.location.hash = "#/login"; return; }
  const listEl = document.getElementById("ordersList");
  const emptyEl = document.getElementById("ordersEmpty");
  let allOrders = [], activeFilter = "all", searchTerm = "";

  if (ordersUnsub) { ordersUnsub(); ordersUnsub = null; }
  const q = query(collection(db, "orders"), where("uid", "==", currentUser.uid), orderBy("createdAt", "desc"));
  ordersUnsub = onSnapshot(q, (snap) => { allOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => { allOrders = []; render(); });

  function render() {
    let list = [...allOrders];
    if (activeFilter !== "all") list = list.filter((o) => o.category === activeFilter);
    if (searchTerm) {
      const t = searchTerm.toLowerCase();
      list = list.filter((o) => (o.categoryLabel || "").toLowerCase().includes(t) || (o.slotLabel || "").toLowerCase().includes(t) || (o.paymentId || "").toLowerCase().includes(t) || (o.receiptNumber || "").toLowerCase().includes(t));
    }
    if (!list.length) { listEl.innerHTML = ""; emptyEl.classList.remove("hidden"); return; }
    emptyEl.classList.add("hidden");
    listEl.innerHTML = list.map((o) => `
      <div class="bg-[#12141c] border border-white/10 rounded-2xl shadow-sm p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div><p class="font-display font-bold text-lg">${escapeHtml(o.categoryLabel || o.category)}${o.slotLabel ? " — " + escapeHtml(o.slotLabel) : ""}</p>
        <p class="text-steel text-xs mt-1 font-mono">Receipt ${escapeHtml(o.receiptNumber || "—")} · Payment ${escapeHtml(o.paymentId || "—")}</p>
        <p class="text-steel text-xs mt-1">${formatDateTime(o.createdAt)}</p></div>
        <div class="flex items-center gap-3"><span class="text-sm font-mono font-semibold">${formatCurrency(o.amount)}</span>
        <span class="text-xs font-display font-semibold px-3 py-1 rounded-full ${o.paymentStatus === "Paid" ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}">${escapeHtml(o.paymentStatus)}</span></div>
      </div>`).join("");
  }
  document.getElementById("ordersSearch").addEventListener("input", (e) => { searchTerm = e.target.value; render(); });
  document.getElementById("ordersFilterBar").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    document.querySelectorAll("#ordersFilterBar .chip").forEach((b) => { b.classList.remove("bg-bolt", "text-white"); b.classList.add("bg-white/5", "border", "border-white/10"); });
    btn.classList.add("bg-bolt", "text-white"); btn.classList.remove("bg-white/5", "border", "border-white/10");
    activeFilter = btn.dataset.filter; render();
  });
}

function bindAdminLoginView() {
  const form = document.getElementById("adminLoginForm");

  form.addEventListener("submit", async (e) => {

      const cred = await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value.trim(), document.getElementById("adminPassword").value);

   8. ROUTE TABLE + RENDER LOOP
========================================================================== */
const ROUTES = {
  home: { render: homeView, bind: bindHomeView },
  "daily-grind": { render: dailyGrindView, bind: bindDailyGrindView },
  "weekly-war": { render: weeklyWarView, bind: bindWarView },
  "weekend-war": { render: weekendWarView, bind: bindWarView },
  tournaments: { render: tournamentsView, bind: bindTournamentsView },
  "tournament-registration": { render: tournamentRegistrationView, bind: bindTournamentRegistrationView },
  login: { render: loginView, bind: bindLoginView, hideChrome: false },
  payment: { render: paymentView, bind: bindPaymentView, protected: true },
  register: { render: registerView, bind: bindRegisterView, protected: true },
  success: { render: successView, bind: () => {} },
  orders: { render: ordersView, bind: bindOrdersView, protected: true },
  profile: { render: profileView, bind: bindProfileView, protected: true },
  contact: { render: contactView, bind: () => {} },
  about: { render: aboutView, bind: () => {} },
  "admin-login": { render: adminLoginView, bind: bindAdminLoginView },
  admin: { render: adminView, bind: bindAdminView, adminOnly: true },
};

function loadingHtml(msg = "Loading…") {
  return `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><span class="spinner"></span><p class="text-steel text-sm mt-3 font-display">${escapeHtml(msg)}</p></div></div>`;
}

function observeFadeUp() {
  const els = document.querySelectorAll(".fade-up:not(.in-view)");
  if (!els.length) return;
  if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in-view")); return; }
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) { entry.target.classList.add("in-view"); obs.unobserve(entry.target); }
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });
  els.forEach((el) => obs.observe(el));
}

async function render() {
  const { path, params } = parseHash();
  const routeDef = ROUTES[path] || { render: notFoundView, bind: () => {} };

  if (routeDef.protected && !authReady) { document.getElementById("app").innerHTML = loadingHtml("Checking your session…"); return; }
  if (routeDef.protected && authReady && !currentUser) { rememberReturnTo(); window.location.hash = "#/login"; return; }

  if (routeDef.adminOnly) {
    if (!authReady) { document.getElementById("app").innerHTML = loadingHtml("Checking admin access…"); return; }
    if (!currentUser) { window.location.hash = "#/admin-login"; return; }
    if (!isAdminChecked) {
      document.getElementById("app").innerHTML = loadingHtml("Checking admin access…");
      try { const snap = await getDoc(doc(db, "users", currentUser.uid)); isAdminUser = snap.exists() && snap.data().role === "admin"; }
      catch { isAdminUser = false; }
      isAdminChecked = true;
      render();
      return;
    }
    if (!isAdminUser) { document.getElementById("app").innerHTML = layout(forbiddenView()); return; }
  }

  const contentHtml = routeDef.render(params) || "";
  document.getElementById("app").innerHTML = layout(contentHtml, { hideChrome: false });
  bindGlobalChrome();
  routeDef.bind(params);
  requestAnimationFrame(observeFadeUp);
}

/* ==========================================================================
   9. GLOBAL CHROME BINDINGS (header, search, menu) — re-attached every render
========================================================================== */
function bindGlobalChrome() {
  const header = document.getElementById("siteHeader");
  if (header) window.addEventListener("scroll", () => header.classList.toggle("scrolled", window.scrollY > 8), { passive: true });

  // Profile dropdown
  const profileBtn = document.getElementById("profileBtn");
  const profileMenu = document.getElementById("profileMenu");
  if (profileBtn && profileMenu) {
    profileMenu.innerHTML = currentUser
      ? `<a href="#/profile" class="block px-4 py-3 text-white hover:bg-white/5">Profile</a><a href="#/profile" class="block px-4 py-3 text-white hover:bg-white/5">My Account</a><button id="headerLogoutBtn" class="block w-full text-left px-4 py-3 text-white hover:bg-white/5">Logout</button>`
      : `<a href="#/login" class="block px-4 py-3 text-white hover:bg-white/5">Login</a>`;
    profileBtn.addEventListener("click", () => profileMenu.classList.toggle("hidden"));
    document.addEventListener("click", (e) => { if (!profileBtn.contains(e.target) && !profileMenu.contains(e.target)) profileMenu.classList.add("hidden"); }, { once: true });
    const logoutBtn = document.getElementById("headerLogoutBtn");
    if (logoutBtn) logoutBtn.addEventListener("click", async () => { await signOut(auth); window.location.hash = "#/home"; });
  }

  // Hamburger menu
  const menuBtn = document.getElementById("menuBtn"), menuClose = document.getElementById("menuClose");
  const slideMenu = document.getElementById("slideMenu"), menuOverlay = document.getElementById("menuOverlay");
  if (menuBtn) {
    menuBtn.addEventListener("click", () => { slideMenu.classList.remove("translate-x-full"); menuOverlay.classList.remove("hidden"); });
    menuClose.addEventListener("click", () => { slideMenu.classList.add("translate-x-full"); menuOverlay.classList.add("hidden"); });
    menuOverlay.addEventListener("click", () => { slideMenu.classList.add("translate-x-full"); menuOverlay.classList.add("hidden"); });
  }

  // Search overlay with fuzzy matching
  const searchBtn = document.getElementById("searchBtn"), searchOverlay = document.getElementById("searchOverlay");
  const searchInput = document.getElementById("searchInput"), searchClose = document.getElementById("searchClose"), searchResults = document.getElementById("searchResults");
  if (searchBtn) {
    searchBtn.addEventListener("click", () => { searchOverlay.classList.remove("hidden"); searchInput.focus(); });
    searchClose.addEventListener("click", () => { searchOverlay.classList.add("hidden"); searchInput.value = ""; searchResults.innerHTML = ""; });
    searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) { searchOverlay.classList.add("hidden"); searchInput.value = ""; searchResults.innerHTML = ""; } });
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim();
      if (!q) { searchResults.innerHTML = ""; return; }
      const ranked = PAGE_SEARCH_INDEX.map((item) => ({ ...item, score: Math.min(fuzzyScore(q, item.title), ...item.keywords.map((k) => fuzzyScore(q, k))) }))
        .filter((i) => i.score <= 3).sort((a, b) => a.score - b.score);
      searchResults.innerHTML = ranked.length
        ? ranked.map((r) => `<li><a href="${r.url}" class="block px-4 py-3 rounded-lg bg-white/5 hover:bg-white/10 text-white font-display">${escapeHtml(r.title)}</a></li>`).join("")
        : `<li class="text-white/40 px-4">No matches found.</li>`;
    });
  }
}

window.addEventListener("hashchange", render);
onAuthStateChanged(auth, (user) => {
  currentUser = user; authReady = true;
  if (!user) { isAdminChecked = false; isAdminUser = false; }
  render();
});
if (!window.location.hash) window.location.hash = "#/home"; else render();

BACKEND REFERENCE (documentation only — NOT part of this single HTML file)
--------------------------------------------------------------------------
This app already takes real payments client-side via Razorpay Checkout —
no backend required to get started. What a backend adds is tamper-proof
verification: right now the amount charged comes from the page, and the
payment is accepted on Razorpay's client-side success callback alone.
When you're ready to harden that, deploy this alongside the site
(Firebase Cloud Functions is a convenient option) and point
CONFIG.backendBaseUrl at it — createOrderRequest() and
verifyPaymentRequest() in this file already switch to the safer path
automatically once backendBaseUrl is set:

  POST {backendBaseUrl}/createOrder   { category, slot, tournamentId, uid }
    -> looks up the REAL price server-side (never trusts the frontend),
       creates a Razorpay Order via the Orders API using your Razorpay
       Key Secret (never exposed to the browser), and returns
       { amount, orderId } for Razorpay Checkout to use

  POST {backendBaseUrl}/verifyPayment { razorpay_order_id, razorpay_payment_id,
                                         razorpay_signature, category, slot,
                                         tournamentId, uid }
    -> recomputes the HMAC-SHA256 signature server-side with your Razorpay
       Key Secret: hmac_sha256(order_id + "|" + payment_id, KEY_SECRET)
       rejects on mismatch or replay, and only then returns
       { verified: true, paymentId }
    -> optionally cross-check with Razorpay's Payments API server-side
       for extra safety before marking anything Paid

  POST {backendBaseUrl}/notify        { channel, event, payload }
    -> forwards admin-only notifications (new registration, payment issues)
       to WhatsApp Business API / Telegram bot / email, using secrets that
       also never touch the frontend

Firestore Security Rules (deploy separately, not embedded in HTML):
  - users/{uid}: owner or admin only
  - registrations/{id}, orders/{id}: creator (uid match) can create/read own;
    only admin can update/delete
  - tournaments, scrims, faq, announcements, whatsapp_links, settings:
    public read, admin-only write (check users/{uid}.role == 'admin')
  - payment_logs: no client access at all — Admin SDK only
